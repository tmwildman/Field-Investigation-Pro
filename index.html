<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Utility Field Investigator Pro v7.1</title>
<style>
:root{--primary:#004a99;--accent:#ff8c00;--secondary:#28a745;--danger:#d9534f;--bg:#f4f7f6;--text:#333;--card:#fff;--border:#ced4da}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);margin:0;overscroll-behavior:none}
body.solar-mode{--bg:#fff;--text:#000;--card:#fff;--border:#000}
nav{display:flex;background:var(--primary);position:sticky;top:0;z-index:100}
nav button{flex:1;padding:14px;border:none;background:none;color:#fff;font-weight:700;font-size:11px;border-bottom:4px solid transparent;text-transform:uppercase}
nav button.active{border-bottom-color:#fff;background:rgba(255,255,255,.12)}
.container{max-width:1000px;margin:auto;padding:14px}.section{display:none}.section.active{display:block}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 4px 15px rgba(0,0,0,.09);border:1px solid var(--border)}
h3{font-size:.82rem;margin:0 0 10px;color:var(--primary);text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid #eee;padding-bottom:6px}
.row{display:flex;gap:8px;flex-wrap:wrap}.col{flex:1;min-width:220px}
label{display:block;font-weight:700;margin:10px 0 5px;font-size:.75rem}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--border);border-radius:6px;box-sizing:border-box;font-size:1rem;background:#fff; -webkit-appearance:none;}
.btn-tool{border:none;border-radius:8px;cursor:pointer;font-weight:700;background:#eee;border:1px solid #ccc;padding:12px;font-size:.8rem;min-width:120px}
.mic-active{background:var(--danger) !important; color:white; animation:pulse 1.5s infinite;}
@keyframes pulse {0% {opacity:1;} 50% {opacity:0.5;} 100% {opacity:1;}}
#gps-data,#jurisdictionBanner{font-family:monospace;font-size:.92rem;background:#f7f7f7;padding:10px;border-radius:6px;border-left:4px solid var(--accent)}
.checklist-item{display:flex;align-items:center;gap:10px;padding:8px;border-bottom:1px solid #eee}
</style>
</head>
<body>

<nav>
<button id="btn-inv" class="active" onclick="tab('investigation', this)">Field Form</button>
<button id="btn-pho" onclick="tab('photos', this)">Photo Audit</button>
<button id="btn-ref" onclick="tab('reference', this)">Pocket Book</button>
<button id="btn-set" onclick="tab('settings', this)">Settings</button>
</nav>

<div class="container">
    <div id="investigation" class="section active">
        <div class="row">
            <button id="gps-toggle" class="btn-tool" style="background:var(--accent); color:white;" onclick="getGPS()">📍 Start Tracking</button>
            <button id="dictate-btn" class="btn-tool" onclick="toggleDictation('notes', this)">🎤 Dictate</button>
        </div>

        <div class="card">
            <h3>1. Location & Logic</h3>
            <div id="gps-data">GPS: Off</div>
            <div id="jurisdictionBanner" style="margin-top:10px;">Jurisdiction: Ohio</div>
            <div class="row" style="margin-top:10px;">
                <div class="col"><label>Asset Dia (in)</label><input type="number" id="pDia" value="0.5" inputmode="decimal" oninput="calc()"></div>
                <div class="col"><label>Dist. from Mark (in)</label><input type="number" id="dOff" inputmode="decimal" oninput="calc()"></div>
            </div>
            <div id="res" style="background:#fff;padding:15px;border-radius:6px;font-weight:700;text-align:center;border:1px solid #ccc; margin-top:10px;">Waiting...</div>
        </div>

        <div class="card">
            <h3>2. Liability Narrative</h3>
            <select id="root" onchange="updateLiabilityNarrative()">
                <option value="">-- Select Root Cause --</option>
                <option value="1">1. No Notification (No Ticket)</option>
                <option value="2">2. Improper Excavation in TZ</option>
                <option value="3">3. Failure to Maintain Marks</option>
                <option value="5">5. Digging Outside Ticket Scope</option>
            </select>
            <div id="liabilityNarrative" class="small" style="background:#fff9e6; padding:10px; border-radius:6px; color:var(--danger); font-weight:bold; border-left:4px solid var(--danger); margin-top:10px; min-height:20px;"></div>
            <textarea id="notes" rows="4" placeholder="General investigator notes..." style="margin-top:10px;"></textarea>
        </div>

        <div class="card">
            <h3>3. Actions</h3>
            <button class="btn-tool" style="width:100%; background:var(--secondary); color:white;" onclick="generateFieldNotice()">📧 Send Field Notice</button>
        </div>
    </div>

    <div id="photos" class="section">
        <div class="card">
            <h3>Forensic Photo Checklist</h3>
            <div class="checklist-item"><input type="checkbox"> <label>Wide Shot (Context)</label></div>
            <div class="checklist-item"><input type="checkbox"> <label>The "Scar" (Close-up)</label></div>
            <div class="checklist-item"><input type="checkbox"> <label>Marks vs. Damage (Scale)</label></div>
            <input type="file" accept="image/*" capture="environment" multiple style="margin-top:15px;">
        </div>
    </div>

    <div id="reference" class="section">
        <div class="card">
            <h3>50-State Statutory Search</h3>
            <input type="text" id="search" onkeyup="filterRef()" placeholder="Search state...">
            <div id="refList" style="margin-top:10px;"></div>
        </div>
    </div>

    <div id="settings" class="section">
        <div class="card">
            <h3>Investigation Defaults</h3>
            <label>Current State</label>
            <select id="defaultState"></select>
        </div>
    </div>
</div>

<script>
let watchId = null, wakeLock = null, recognition = null;

const states = [
    ['AL','Alabama',18,'Alabama 811','2 business days','Ala. Code § 37-15'],
    ['IN','Indiana',24,'Indiana 811','2 full working days','IC § 8-1-26'],
    ['MI','Michigan',18,'MISS DIG 811','3 working days','Act 174 of 2013'],
    ['OH','Ohio',18,'Ohio 811','48 hours','ORC § 3781.25-32'],
    ['PA','Pennsylvania',18,'PA One Call','3 business days','PA Act 287'],
    ['TX','Texas',18,'Texas 811','48 hours','Texas Admin. Code § 18']
    // ... [Rest of 50 states included in final code]
];

const stateMap = Object.fromEntries(states.map(s => [s[0], {code:s[0], name:s[1], tz:s[2], center:s[3], notice:s[4], law:s[5]}]));
let currentState = stateMap.OH;

function q(id){return document.getElementById(id)}

function tab(name, btn){
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
    q(name).classList.add('active');
    btn.classList.add('active');
}

function init() {
    const stateSelect = q('defaultState');
    states.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s[0]; opt.textContent = `${s[0]} - ${s[1]}`;
        stateSelect.appendChild(opt);
    });

    stateSelect.addEventListener('change', (e) => {
        currentState = stateMap[e.target.value];
        q('jurisdictionBanner').innerText = `Jurisdiction: ${currentState.name} (${currentState.center})`;
        calc();
    });

    stateSelect.value = 'OH';
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new Speech();
    }
}

async function getGPS() {
    if (watchId) { 
        navigator.geolocation.clearWatch(watchId); 
        watchId = null; 
        q('gps-toggle').innerText = "📍 Start Tracking"; 
        if(wakeLock) { await wakeLock.release(); wakeLock = null; }
        return; 
    }
    
    q('gps-toggle').innerText = "🛑 Stop Tracking";
    if ('wakeLock' in navigator) { try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e){} }

    watchId = navigator.geolocation.watchPosition(pos => {
        const acc = pos.coords.accuracy.toFixed(1);
        q('gps-data').innerHTML = `ACCURACY: +/- ${acc}m<br>LAT: ${pos.coords.latitude.toFixed(5)}<br>LON: ${pos.coords.longitude.toFixed(5)}`;
    }, (err) => { q('gps-data').innerText = "GPS Error: " + err.message; }, {enableHighAccuracy:true, timeout:10000});
}

function updateLiabilityNarrative() {
    const root = q('root').value;
    const off = parseFloat(q('dOff').value) || 0;
    const dia = parseFloat(q('pDia').value) || 0;
    const limit = currentState.tz + (dia/2);
    let nar = (off > 0 && off <= limit) ? `STRIKE WITHIN ZONE: Excavator violated ${currentState.law} by using mechanical means within ${limit}". ` : "";
    if(root === "1") nar += `VIOLATION: Failure to notify ${currentState.center} per ${currentState.law}.`;
    q('liabilityNarrative').innerText = nar;
}

function calc(){
    const dia=parseFloat(q('pDia').value)||0, off=parseFloat(q('dOff').value)||0, limit=currentState.tz+(dia/2);
    q('res').innerText = off<=limit ? `⚠️ INSIDE ZONE (${limit}")` : `✅ OUTSIDE ZONE (${limit}")`;
    q('res').style.background = off<=limit ? '#f8d7da' : '#d4edda';
    updateLiabilityNarrative();
}

function toggleDictation(tid, btn) {
    if(!recognition) return alert("Speech not supported on this browser.");
    btn.classList.add('mic-active');
    recognition.start();
    recognition.onresult = (e) => { 
        q(tid).value += (q(tid).value ? " " : "") + e.results[0][0].transcript; 
        btn.classList.remove('mic-active');
    };
    recognition.onerror = () => btn.classList.remove('mic-active');
}

function generateFieldNotice() {
    const body = `NOTICE OF DAMAGE: ${currentState.name}\nStatute: ${currentState.law}\nFinding: ${q('liabilityNarrative').innerText}\nInvestigator: Ted Wildman`;
    window.location.href = `mailto:?subject=Utility Damage Notice&body=${encodeURIComponent(body)}`;
}

window.onload = init;
</script>
</body>
</html>
