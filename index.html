<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Utility Investigator Pro v4.0</title>
    <style>
        :root { 
            --primary: #004a99; --secondary: #28a745; --danger: #d9534f; 
            --bg: #f4f7f6; --text: #333; --card: #ffffff; --border: #ced4da;
        }

        /* High Contrast / Solar Mode */
        body.solar-mode { 
            --bg: #ffffff; --text: #000; --card: #fff; --border: #000; --primary: #002b59; 
        }

        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 10px; margin: 0; transition: 0.3s; }
        .container { max-width: 700px; margin: auto; background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 1px solid var(--border); }
        
        /* Progress Bar */
        .progress-stepper { height: 8px; background: #ddd; border-radius: 4px; margin-bottom: 20px; overflow: hidden; }
        #progressFill { height: 100%; width: 0%; background: var(--secondary); transition: 0.5s ease; }

        .section { margin-bottom: 15px; padding: 15px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); }
        h2 { text-align: center; color: var(--primary); margin: 0 0 10px; text-transform: uppercase; }
        h3 { font-size: 0.85rem; margin-top: 0; color: #666; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #eee; padding-bottom: 5px; }

        .row { display: flex; gap: 8px; margin-bottom: 10px; }
        label { display: block; font-weight: bold; margin: 10px 0 5px; font-size: 0.85rem; }
        input, textarea, select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-size: 1rem; background: #fff; color: inherit; }

        /* UI Enhancements */
        .btn-tool { background: #eee; border: 1px solid #ccc; padding: 10px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; font-weight: 600; flex: 1; }
        .solar-mode .btn-tool { background: #fff; border: 2px solid #000; color: #000; }
        
        .photo-audit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .audit-item { padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.8rem; display: flex; align-items: center; }
        .audit-item input { width: auto; margin-right: 10px; transform: scale(1.3); }

        .badge { background: #333; color: gold; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        canvas { border: 1px solid var(--border); width: 100%; height: 180px; background: #fff; touch-action: none; border-radius: 6px; }
        
        .calc-result { padding: 15px; border-radius: 6px; margin-top: 10px; font-weight: bold; text-align: center; font-size: 1rem; }
        .btn-print { width: 100%; background: var(--danger); color: white; border: none; padding: 20px; border-radius: 10px; font-weight: bold; font-size: 1.2rem; cursor: pointer; margin-top: 20px; }

        @media print { .btn-tool, .btn-print, .progress-stepper, .bypass-btn { display: none !important; } }
    </style>
</head>
<body>

<div class="container">
    <div class="progress-stepper"><div id="progressFill"></div></div>
    
    <div class="row" style="margin-bottom: 20px;">
        <button class="btn-tool" onclick="document.body.classList.toggle('solar-mode')">🔆 Solar Mode</button>
        <button class="btn-tool" onclick="getLocation()">📍 Auto-Detect Info</button>
    </div>

    <h2>Investigation Report</h2>

    <div class="section">
        <h3>1. Site & Weather</h3>
        <div class="row">
            <span id="stateDisplay" class="badge">DETECTING JURISDICTION...</span>
            <span id="weatherDisplay" class="badge" style="background:var(--primary)">WAITING FOR GPS...</span>
        </div>
        <label>Address</label>
        <input type="text" id="address" oninput="updateProgress()">
        <label>Ticket #</label>
        <input type="text" id="claimId" oninput="updateProgress()">
    </div>

    <div class="section" style="background:#eef6ff; border-color:var(--primary);">
        <h3>2. Statutory Accuracy Calculator</h3>
        <p id="lawRef" style="font-size: 0.7rem; font-style: italic; color: var(--primary);">Detect location to apply state law.</p>
        <div class="row">
            <div style="flex:1">
                <label>Pipe Dia (in)</label>
                <input type="number" id="pipeDia" value="0" oninput="calcTolerance()">
            </div>
            <div style="flex:1">
                <label>Off-Mark (in)</label>
                <input type="number" id="distOff" oninput="calcTolerance()">
            </div>
        </div>
        <div id="calcResult" class="calc-result" style="background:#eee;">Awaiting Data...</div>
    </div>

    <div class="section">
        <h3>3. Professional Photo Audit</h3>
        <div class="photo-audit-grid">
            <label class="audit-item"><input type="checkbox" class="audit-check" onchange="updateProgress()"> 360° Site Context</label>
            <label class="audit-item"><input type="checkbox" class="audit-check" onchange="updateProgress()"> Locate Marks</label>
            <label class="audit-item"><input type="checkbox" class="audit-check" onchange="updateProgress()"> Point of Damage</label>
            <label class="audit-item"><input type="checkbox" class="audit-check" onchange="updateProgress()"> Measurement Shot</label>
        </div>
        <div class="row" style="margin-top: 10px;">
            <button class="btn-tool bypass-btn" style="color:var(--danger)" onclick="bypassAudit()">⚠️ Conditions Prevent Photos</button>
        </div>
        <textarea id="bypassReason" rows="2" style="display:none; margin-top:10px; border-color:var(--danger);" placeholder="EXPLAIN BYPASS (e.g., Trench collapse, night ops, safety zone)..."></textarea>
    </div>

    <div class="section">
        <h3>4. Expert Findings</h3>
        <label>Primary Fault</label>
        <select id="fault" onchange="updateProgress()">
            <option value="">-- Choose Liability --</option>
            <option value="excavator">Excavator: Within Tolerance</option>
            <option value="locator">Locator: Outside Tolerance</option>
            <option value="utility">Utility: Bad Records</option>
        </select>
        <label>Final Narrative</label>
        <textarea id="notes" rows="4" placeholder="Detailed evidence analysis..."></textarea>
    </div>

    <div class="section">
        <h3>5. Certification Sketch & Signature</h3>
        <canvas id="sketchPad"></canvas>
        <button class="btn-tool" onclick="clearPad('sketchPad')">Clear Sketch</button>
        <label>Signature</label>
        <canvas id="sigPad" style="height:80px;"></canvas>
    </div>

    <button class="btn-print" onclick="window.print()">FINAL PDF REPORT</button>
</div>

<script>
    // --- APP LOGIC ---
    let currentState = "Default";
    const stateLaws = {
        "Virginia": 24, "Maryland": 18, "Pennsylvania": 18, "Massachusetts": 18, "Default": 18
    };

    async function getLocation() {
        if (!navigator.geolocation) return alert("GPS not supported");
        
        navigator.geolocation.getCurrentPosition(async (pos) => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            
            // 1. Detect State Law
            try {
                const geo = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                const gData = await geo.json();
                currentState = gData.address.state || "Default";
                document.getElementById('stateDisplay').innerText = `JURISDICTION: ${currentState.toUpperCase()}`;
                document.getElementById('lawRef').innerText = `Applying ${stateLaws[currentState] || 18}" State Tolerance Law.`;
            } catch(e) { console.log("State detection failed"); }

            // 2. Fetch Automated Weather (Open Meteo - No Key Required)
            try {
                const wx = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                const wData = await wx.json();
                const temp = (wData.current_weather.temperature * 9/5 + 32).toFixed(1);
                document.getElementById('weatherDisplay').innerText = `TEMP: ${temp}°F | WX CODE: ${wData.current_weather.weathercode}`;
            } catch(e) { document.getElementById('weatherDisplay').innerText = "WEATHER FETCH FAILED"; }
            
            calcTolerance();
            updateProgress();
        });
    }

    function calcTolerance() {
        const dia = parseFloat(document.getElementById('pipeDia').value) || 0;
        const off = parseFloat(document.getElementById('distOff').value) || 0;
        const res = document.getElementById('calcResult');
        const limit = (stateLaws[currentState] || 18) + (dia / 2);

        if (off === 0) { res.innerText = "Enter Measurements"; res.style.backgroundColor="#eee"; }
        else if (off <= limit) { res.innerText = "🚨 EXCAVATOR FAULT (Within Zone)"; res.style.backgroundColor="#f8d7da"; }
        else { res.innerText = "✅ LOCATOR FAULT (Outside Zone)"; res.style.backgroundColor="#d4edda"; }
        updateProgress();
    }

    function updateProgress() {
        const fields = [document.getElementById('address').value, document.getElementById('claimId').value, document.getElementById('fault').value];
        const checks = document.querySelectorAll('.audit-check:checked').length;
        const totalFields = fields.filter(f => f !== "").length;
        
        let progress = ((totalFields + (checks / 2)) / 5) * 100;
        document.getElementById('progressFill').style.width = Math.min(progress, 100) + "%";
    }

    function bypassAudit() {
        const area = document.getElementById('bypassReason');
        area.style.display = area.style.display === 'none' ? 'block' : 'none';
        updateProgress();
    }

    // --- DRAWING PADS ---
    function setupCanvas(id) {
        const canvas = document.getElementById(id);
        const ctx = canvas.getContext('2d');
        let drawing = false;
        const getXY = (e) => {
            const r = canvas.getBoundingClientRect();
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: cx - r.left, y: cy - r.top };
        }
        canvas.addEventListener('mousedown', (e) => { drawing = true; ctx.beginPath(); const p = getXY(e); ctx.moveTo(p.x, p.y); });
        canvas.addEventListener('mousemove', (e) => { if(!drawing) return; e.preventDefault(); const p = getXY(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
        canvas.addEventListener('mouseup', () => drawing = false);
        canvas.addEventListener('touchstart', (e) => { drawing = true; ctx.beginPath(); const p = getXY(e); ctx.moveTo(p.x, p.y); });
        canvas.addEventListener('touchmove', (e) => { if(!drawing) return; e.preventDefault(); const p = getXY(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
    }

    function clearPad(id) { document.getElementById(id).getContext('2d').clearRect(0,0,1000,1000); }

    window.onload = () => { setupCanvas('sketchPad'); setupCanvas('sigPad'); };
</script>

</body>
</html>
