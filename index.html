<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Utility Investigator Pro v4</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--primary:#004a99;--accent:#ff8c00;--bg:#f4f7f6;--text:#333;--card:#fff;--border:#ced4da}
body{font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text);margin:0}
nav{display:flex;background:var(--primary);position:sticky;top:0;z-index:1000}
nav button{flex:1;padding:15px;border:none;background:none;color:#fff;font-weight:700;font-size:10px;text-transform:uppercase}
.container{max-width:800px;margin:auto;padding:15px}
.card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:15px;border:1px solid var(--border);box-shadow:0 4px 6px rgba(0,0,0,0.1)}
h3{font-size:0.85rem;margin:0 0 12px;text-transform:uppercase;color:var(--primary);border-bottom:1px solid var(--border);padding-bottom:5px}
.btn-main{width:100%;padding:16px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer}
.photo-preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:10px}
.photo-preview img{width:100%;border-radius:6px;border:1px solid var(--border)}
#gps-status{font-size:0.8rem;background:#eee;padding:8px;border-radius:4px;margin-bottom:10px;font-family:monospace}
</style>
</head>
<body>

<nav>
    <button onclick="location.reload()">Refresh App</button>
</nav>

<div class="container">
    <div class="card">
        <h3>1. Location Capture</h3>
        <div id="gps-status">GPS: Not Captured</div>
        <button class="btn-main" style="background:#666" onclick="getGPS()">📍 Sync GPS Coordinates</button>
    </div>

    <div class="card">
        <h3>2. Evidence Photos</h3>
        <input type="file" id="evidenceInput" accept="image/*" multiple style="display:none" onchange="handleFiles(this.files)">
        <button class="btn-main" onclick="document.getElementById('evidenceInput').click()">📸 Add Camera or Gallery Photo</button>
        
        <div id="preview" class="photo-preview"></div>
        <p style="font-size:0.7rem; color:#888; margin-top:10px;">
            * Photos are automatically compressed and watermarked with GPS/Time for litigation.
        </p>
    </div>
</div>

<script>
let currentGPS = "No GPS Data";

function getGPS() {
    navigator.geolocation.getCurrentPosition(p => {
        currentGPS = `${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`;
        document.getElementById('gps-status').innerText = `GPS: ${currentGPS}`;
    }, () => alert("Enable GPS for watermarking."));
}

async function handleFiles(files) {
    const preview = document.getElementById('preview');
    const timeStamp = new Date().toLocaleString();

    for (let file of files) {
        const img = new Image();
        img.src = URL.createObjectURL(file);
        
        img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // Forensic Compression (1200px max)
            const scale = 1200 / img.width;
            canvas.width = 1200;
            canvas.height = img.height * scale;
            
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            // Forensic Watermark (GPS + Timestamp)
            ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
            ctx.fillRect(0, canvas.height - 50, canvas.width, 50);
            ctx.fillStyle = "white";
            ctx.font = "bold 22px Arial";
            ctx.fillText(`SECURE EVIDENCE | ${timeStamp} | ${currentGPS}`, 20, canvas.height - 18);
            
            // Create Thumbnail for App UI
            const thumb = document.createElement('img');
            thumb.src = canvas.toDataURL('image/jpeg', 0.8);
            preview.appendChild(thumb);
            
            // Optional: Haptic Feedback on success
            if(navigator.vibrate) navigator.vibrate(20);
        };
    }
}
</script>
</body>
</html>
