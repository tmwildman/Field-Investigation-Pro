<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Utility Damage Investigator Pro v7</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root{--primary:#004a99;--accent:#ff8c00;--secondary:#28a745;--danger:#d9534f;--bg:#f4f7f6;--text:#333;--card:#fff;--border:#ced4da}
body.glare-mode{--bg:#000;--text:#ffff00;--card:#111;--border:#ffff00;--primary:#ffff00;--secondary:#ffff00}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);margin:0;transition:0.2s;overscroll-behavior:none}

/* Navigation */
nav{display:flex;background:var(--primary);position:sticky;top:0;z-index:100;box-shadow:0 2px 5px rgba(0,0,0,0.2)}
nav button{flex:1;padding:15px 5px;border:none;background:none;color:#fff;font-weight:700;font-size:10px;text-transform:uppercase;border-bottom:4px solid transparent}
nav button.active{border-bottom-color:var(--accent);background:rgba(255,255,255,0.1)}
body.glare-mode nav button{color:#000}

/* Layout */
.container{max-width:1000px;margin:auto;padding:14px}
.section{display:none}.section.active{display:block}
.card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 4px 15px rgba(0,0,0,0.08);border:1px solid var(--border)}
h3{font-size:.85rem;margin:0 0 12px;color:var(--primary);text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid #eee;padding-bottom:6px}

/* Forms */
.row{display:flex;gap:10px;flex-wrap:wrap}.col{flex:1;min-width:240px}
label{display:block;font-weight:700;margin:10px 0 5px;font-size:.75rem;text-transform:uppercase}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;box-sizing:border-box;font-size:1rem;background:var(--card);color:var(--text)}
.btn-main{width:100%;padding:16px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-weight:700;margin-top:10px;cursor:pointer}
body.glare-mode .btn-main{color:#000;border:1px solid #000}

/* Evidence Gallery */
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}
.photo-grid img{width:100%;border-radius:8px;border:2px solid var(--border)}
canvas#sigCanvas{width:100%;height:160px;touch-action:none;border:2px solid var(--border);background:#fff;border-radius:8px}
.badge-law{display:inline-block;padding:4px 10px;border-radius:4px;background:#e9ecef;font-size:0.75rem;font-weight:bold;margin-top:5px}
</style>
</head>
<body>

<nav>
    <button id="btn-inv" class="active" onclick="tab('investigation')">Field Form</button>
    <button id="btn-hdd" onclick="tab('hdd')">Bore/HDD</button>
    <button id="btn-aer" onclick="tab('aerial')">Aerial Audit</button>
    <button id="btn-ref" onclick="tab('reference')">Pocket Book</button>
    <button id="btn-set" onclick="tab('settings')">Settings</button>
</nav>

<div class="container">
    
    <div id="investigation" class="section active">
        <div class="row" style="margin-bottom:15px">
            <button class="btn-main" style="flex:1; margin-top:0; background:#444" onclick="toggleGlare()">🔆 Glare Mode</button>
            <button class="btn-main" style="flex:1; margin-top:0; background:var(--secondary)" onclick="getGPS()">📍 Sync GPS</button>
        </div>

        <div class="card">
            <h3>1. Incident Header</h3>
            <div class="row">
                <div class="col">
                    <label>Claim / Reference ID</label>
                    <input type="text" id="claimId" oninput="autosave()">
                    <label>GPS Coordinates</label>
                    <input type="text" id="gpsDisplay" readonly placeholder="Tap Sync GPS...">
                </div>
                <div class="col">
                    <label>State Jurisdiction</label>
                    <select id="stateSelect" onchange="updateJurisdiction()"></select>
                    <div id="lawBadge" class="badge-law">Loading...</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>2. Subrogation Checklist (ANSI/CGA/OSHA)</h3>
            <label><input type="checkbox" id="c1" onchange="autosave()"> Potholing Verified (CGA 5-19)</label>
            <label><input type="checkbox" id="o1" onchange="autosave()"> OSHA 1926.651(b)(1-3) Compliance</label>
            <label><input type="checkbox" id="c2" onchange="autosave()"> Tracer Wire Continuity (CGA 5-17)</label>
            <label><input type="checkbox" id="a1" onchange="autosave()"> ANSI 38-22 Level Verified</label>
            <label>DIRT Root Cause</label>
            <select id="dirtRoot" onchange="autosave()">
                <option>Excavation Practice Not Followed</option>
                <option>Locating Issue: Marked Inaccurately</option>
                <option>Locating Issue: Not Marked</option>
                <option>No Notification to One-Call</option>
            </select>
        </div>

        <div class="card">
            <h3>3. Forensic Evidence Capture</h3>
            <div style="display:flex; gap:10px">
                <button class="btn-main" onclick="document.getElementById('camIn').click()">📸 Camera</button>
                <button class="btn-main" style="background:#666" onclick="document.getElementById('galIn').click()">📁 Gallery</button>
            </div>
            <input type="file" id="camIn" accept="image/*" capture="camera" style="display:none" onchange="procPhotos(this.files)">
            <input type="file" id="galIn" accept="image/*" multiple style="display:none" onchange="procPhotos(this.files)">
            <div id="preview" class="photo-grid"></div>
        </div>

        <div class="card">
            <h3>4. Field Narrative & Signature</h3>
            <textarea id="notes" rows="4" placeholder="Enter detailed scene observations for subrogation..." oninput="autosave()"></textarea>
            <label>Investigator Signature</label>
            <canvas id="sigCanvas"></canvas>
            <button class="btn-main" style="background:var(--secondary)" onclick="copyReport()">📋 Copy Full Forensic Report</button>
        </div>
    </div>

    <div id="hdd" class="section">
        <div class="card">
            <h3>Horizontal Directional Drilling Audit</h3>
            <label><input type="checkbox" onchange="autosave()"> Crossing Potholes Verified (CGA 5-19)</label>
            <label><input type="checkbox" onchange="autosave()"> Bore Log matches Real-Time Tracking</label>
            <label><input type="checkbox" onchange="autosave()"> Utility Clearance Confirmed by Hand Dig</label>
            <label>Bore Path Narrative</label>
            <textarea id="hddNotes" rows="6" oninput="autosave()"></textarea>
        </div>
    </div>

    <div id="aerial" class="section">
        <div class="card">
            <h3>Aerial & Tear-Down Compliance</h3>
            <label>Strike Type</label>
            <select id="aerialIssue">
                <option>Tear-Down: Low Hanging Wire</option>
                <option>Pole/Anchor Strike</option>
                <option>Encroachment (OSHA MAD Violation)</option>
            </select>
            <label>Measured Vertical Clearance (Feet)</label>
            <input type="number" step="0.1" id="vertClear" oninput="autosave()">
            <label>Relevant Code Reference</label>
            <select onchange="autosave()">
                <option>NESC Rule 232 (Clearance)</option>
                <option>OSHA 1926.416 (Line Contact)</option>
                <option>NESC Rule 235 (Separation)</option>
            </select>
            <label>Aerial Scene Notes</label>
            <textarea id="aerNotes" rows="5" oninput="autosave()"></textarea>
        </div>
    </div>

    <div id="reference" class="section">
        <div class="card">
            <h3>Legal & Safety Pocket Book</h3>
            <input type="text" id="search" onkeyup="searchPocket()" placeholder="Search States, OSHA, NESC, or CGA...">
            <div id="pocketList" style="margin-top:15px"></div>
        </div>
    </div>

    <div id="settings" class="section">
        <div class="card">
            <h3>App Configuration</h3>
            <label>Default Home State</label>
            <select id="defState" onchange="saveSet()"></select>
            <label>Haptic Feedback</label>
            <select id="haptic" onchange="saveSet()">
                <option value="on">Enabled</option>
                <option value="off">Disabled</option>
            </select>
            <button class="btn-main" onclick="localStorage.clear(); location.reload();">Clear All Cached Data</button>
        </div>
    </div>

</div>

<script>
// FULL 50-STATE + FEDERAL DATABASE
const masterDB = {
    'AL':{n:'Alabama',z:18,l:'Title 37-15'},'AK':{n:'Alaska',z:24,l:'AS 42.30'},
    'AZ':{n:'Arizona',z:24,l:'AZ RS 40-360'},'AR':{n:'Arkansas',z:18,l:'AR Code 14-271'},
    'CA':{n:'California',z:24,l:'Gov Code 4216'},'CO':{n:'Colorado',z:18,l:'CRS 9-1.5'},
    'CT':{n:'Connecticut',z:18,l:'PURA 16-345'},'DE':{n:'Delaware',z:18,l:'DE Code 7-26'},
    'FL':{n:'Florida',z:24,l:'FL Stat 556'},'GA':{n:'Georgia',z:18,l:'GUPS Act'},
    'HI':{n:'Hawaii',z:18,l:'HRS 269E'},'ID':{n:'Idaho',z:18,l:'ID Code 55-22'},
    'IL':{n:'Illinois',z:18,l:'IL RS 220-50'},'IN':{n:'Indiana',z:24,l:'IC 8-1-26'},
    'IA':{n:'Iowa',z:18,l:'IA Code 480'},'KS':{n:'Kansas',z:24,l:'KSA 66-1801'},
    'KY':{n:'Kentucky',z:18,l:'KRS 367'},'LA':{n:'Louisiana',z:18,l:'RS 40:1749'},
    'ME':{n:'Maine',z:18,l:'23 MRSA 3360'},'MD':{n:'Maryland',z:18,l:'Title 12-121'},
    'MA':{n:'Massachusetts',z:18,l:'MGL 82'},'MI':{n:'Michigan',z:18,l:'Act 174'},
    'MN':{n:'Minnesota',z:24,l:'MN Stat 216D'},'MS':{n:'Mississippi',z:18,l:'MS Code 77-13'},
    'MO':{n:'Missouri',z:24,l:'RSMO 319.010'},'MT':{n:'Montana',z:18,l:'MCA 69-4-501'},
    'NE':{n:'Nebraska',z:18,l:'NE RS 76-2301'},'NV':{n:'Nevada',z:24,l:'NRS 455'},
    'NH':{n:'New Hampshire',z:18,l:'RSA 374:48'},'NJ':{n:'New Jersey',z:18,l:'NJSA 48:2'},
    'NM':{n:'New Mexico',z:18,l:'NMSA 62-14'},'NY':{n:'New York',z:24,l:'GBL 28-A'},
    'NC':{n:'North Carolina',z:24,l:'NC GS 87-115'},'ND':{n:'North Dakota',z:18,l:'NDCC 49-23'},
    'OH':{n:'Ohio',z:18,l:'ORC 3781.25'},'OK':{n:'Oklahoma',z:24,l:'OK Stat 63-142'},
    'OR':{n:'Oregon',z:24,l:'OAR 952-001'},'PA':{n:'Pennsylvania',z:18,l:'Act 287'},
    'RI':{n:'Rhode Island',z:18,l:'RIGL 39-1.2'},'SC':{n:'South Carolina',z:24,l:'SC Code 58-35'},
    'SD':{n:'South Dakota',z:18,l:'SDCL 49-7A'},'TN':{n:'Tennessee',z:24,l:'TN Code 65-31'},
    'TX':{n:'Texas',z:18,l:'Utilities Code 251'},'UT':{n:'Utah',z:18,l:'UT Code 54-8a'},
    'VT':{n:'Vermont',z:18,l:'30 VSA 37'},'VA':{n:'Virginia',z:24,l:'VA Code 56-265'},
    'WA':{n:'Washington',z:24,l:'RCW 19.122'},'WV':{n:'West Virginia',z:18,l:'WV Code 24-C'},
    'WI':{n:'Wisconsin',z:18,l:'WI Stat 182.0175'},'WY':{n:'Wyoming',z:24,l:'WY Stat 37-12'},
    'OSHA-1926':{n:'OSHA Subpart P',z:'N/A',l:'Excavation Standard',d:'Mandates utility location (b1) and support of exposed lines (b3).'},
    'NESC-232':{n:'NESC Rule 232',z:'N/A',l:'Vertical Clearance',d:'Telecomm: 15.5ft over roads/driveways.'},
    'ANSI-38-22':{n:'ANSI ASCE 38-22',z:'N/A',l:'SUE Standard',d:'Quality Levels A, B, C, D for utility data reliability.'},
    'CGA-5-19':{n:'CGA Best Practices',z:'N/A',l:'Visual Verification',d:'Mandatory hand-dig or vacuum within tolerance zone.'}
};

function tab(id){
    if(navigator.vibrate && document.getElementById('haptic').value === 'on') navigator.vibrate(5);
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.getElementById('btn-'+id.substring(0,3)).classList.add('active');
}

function toggleGlare(){ if(navigator.vibrate) navigator.vibrate(20); document.body.classList.toggle('glare-mode'); }

function getGPS(){
    navigator.geolocation.getCurrentPosition(p=>{
        document.getElementById('gpsDisplay').value=`${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`;
        if(navigator.vibrate) navigator.vibrate(50);
        autosave();
    }, e=>alert("Enable GPS in settings"));
}

function updateJurisdiction(){
    const s = document.getElementById('stateSelect').value;
    const info = masterDB[s];
    document.getElementById('lawBadge').innerText = `${s}: ${info.l} | Zone: ${info.z}"`;
    autosave();
}

async function procPhotos(files){
    const gps = document.getElementById('gpsDisplay').value || "No GPS";
    const time = new Date().toLocaleString();
    for(let file of files){
        const img = new Image();
        img.src = URL.createObjectURL(file);
        img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 1200; canvas.height = (img.height * (1200/img.width));
            ctx.drawImage(img, 0, 0, 1200, canvas.height);
            ctx.fillStyle = "rgba(0,0,0,0.7)";
            ctx.fillRect(0, canvas.height-50, 1200, 50);
            ctx.fillStyle = "#fff"; ctx.font = "bold 22px Arial";
            ctx.fillText(`FORENSIC EVIDENCE | ${time} | GPS: ${gps}`, 25, canvas.height-18);
            const thumb = document.createElement('img');
            thumb.src = canvas.toDataURL('image/jpeg', 0.8);
            document.getElementById('preview').appendChild(thumb);
        };
    }
}

// Signature Logic
const sigCanvas = document.getElementById('sigCanvas');
const sCtx = sigCanvas.getContext('2d');
let drawing = false;
sigCanvas.addEventListener('touchstart', e=>{ drawing=true; sCtx.beginPath(); e.preventDefault(); });
sigCanvas.addEventListener('touchmove', e=>{
    if(!drawing) return;
    const r = sigCanvas.getBoundingClientRect();
    sCtx.lineTo(e.touches[0].clientX - r.left, e.touches[0].clientY - r.top);
    sCtx.stroke();
});
window.addEventListener('touchend',()=>drawing=false);

function searchPocket(){
    const q = document.getElementById('search').value.toLowerCase();
    document.getElementById('pocketList').innerHTML = Object.keys(masterDB)
        .filter(k => masterDB[k].n.toLowerCase().includes(q) || (masterDB[k].d && masterDB[k].d.toLowerCase().includes(q)))
        .map(k => `<div style="border-bottom:1px solid #ddd; padding:10px 0">
            <strong>${masterDB[k].n} (${masterDB[k].l})</strong><br>
            <small>${masterDB[k].d || 'Tolerance Zone: '+masterDB[k].z+' inches'}</small>
        </div>`).join('');
}

function autosave(){
    const data = {
        claim: document.getElementById('claimId').value,
        state: document.getElementById('stateSelect').value,
        notes: document.getElementById('notes').value
    };
    localStorage.setItem('inv_pro_draft', JSON.stringify(data));
}

function copyReport(){
    const s = document.getElementById('stateSelect').value;
    const report = `FORENSIC UTILITY DAMAGE REPORT\nCLAIM ID: ${document.getElementById('claimId').value}\nSTATE: ${masterDB[s].n} (${masterDB[s].l})\nGPS: ${document.getElementById('gpsDisplay').value}\nROOT CAUSE: ${document.getElementById('dirtRoot').value}\nNARRATIVE: ${document.getElementById('notes').value}`;
    navigator.clipboard.writeText(report);
    alert("Full Field Report Copied.");
}

window.onload = () => {
    const sel = document.getElementById('stateSelect');
    const def = document.getElementById('defState');
    Object.keys(masterDB).forEach(k => {
        if(k.length === 2){
            const opt = document.createElement('option'); opt.value = k; opt.textContent = `${k} - ${masterDB[k].n}`;
            sel.appendChild(opt.cloneNode(true));
            def.appendChild(opt);
        }
    });
    
    const saved = JSON.parse(localStorage.getItem('inv_pro_draft'));
    if(saved){
        document.getElementById('claimId').value = saved.claim;
        sel.value = saved.state;
        document.getElementById('notes').value = saved.notes;
    } else {
        sel.value = 'OH';
    }
    
    updateJurisdiction();
    searchPocket();
};
</script>
</body>
</html>
