<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Utility Field Investigator Pro v7.5</title>
    <style>
        :root{--primary:#004a99;--accent:#ff8c00;--secondary:#28a745;--danger:#d9534f;--bg:#f4f7f6;--text:#333;--card:#fff;--border:#ced4da}
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);margin:0;overscroll-behavior:none}
        body.solar-mode{--bg:#fff;--text:#000;--card:#fff;--border:#000}
        nav{display:flex;background:var(--primary);position:sticky;top:0;z-index:100}
        nav button{flex:1;padding:14px;border:none;background:none;color:#fff;font-weight:700;font-size:11px;border-bottom:4px solid transparent;text-transform:uppercase}
        nav button.active{border-bottom-color:#fff;background:rgba(255,255,255,.12)}
        .container{max-width:1000px;margin:auto;padding:14px}.section{display:none}.section.active{display:block}
        .card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 4px 15px rgba(0,0,0,.09);border:1px solid var(--border)}
        h3{font-size:.82rem;margin:0 0 10px;color:var(--primary);text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid #eee;padding-bottom:6px}
        label{display:block;font-weight:700;margin:10px 0 5px;font-size:.75rem}
        input,textarea,select{width:100%;padding:12px;border:1px solid var(--border);border-radius:6px;box-sizing:border-box;font-size:1rem;background:#fff; -webkit-appearance:none;}
        .btn-tool{border:none;border-radius:8px;cursor:pointer;font-weight:700;background:#eee;border:1px solid #ccc;padding:12px;font-size:.8rem;transition:0.2s}
        .btn-full{width:100%;padding:14px;background:var(--primary);color:#fff;margin-top:10px;border:none;border-radius:8px;font-weight:700}
        .mic-active{background:var(--danger) !important; color:white; animation:pulse 1.5s infinite;}
        @keyframes pulse {0% {opacity:1;} 50% {opacity:0.5;} 100% {opacity:1;}}
        #gps-data,#jurisdictionBanner{font-family:monospace;font-size:.92rem;background:#f7f7f7;padding:10px;border-radius:6px;border-left:4px solid var(--accent)}
        #gps-meter{height:8px; width:100%; background:#eee; border-radius:4px; margin-top:5px; overflow:hidden;}
        #gps-bar{height:100%; width:0%; transition:width 0.3s;}
        .sig-excellent{background:var(--secondary)} .sig-poor{background:var(--danger)}
        .sigwrap{border:1px solid #ccc;border-radius:8px;background:#fff;overflow:hidden;margin-top:10px;}
        canvas{touch-action:none;display:block;width:100%;height:180px;background:#fff}
        .preview{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.thumb{width:80px;height:80px;object-fit:cover;border-radius:6px;border:1px solid #ccc}
    </style>
</head>
<body>

<nav>
    <button id="btn-inv" class="active" onclick="tab('investigation', this)">Investigation</button>
    <button id="btn-hdd" onclick="tab('hdd', this)">Bore/HDD</button>
    <button id="btn-ref" onclick="tab('reference', this)">Pocket Book</button>
    <button id="btn-set" onclick="tab('settings', this)">Settings</button>
</nav>

<div class="container">
    <div id="investigation" class="section active">
        <div class="card">
            <h3>📍 Forensic Geolocation</h3>
            <button id="gps-toggle" class="btn-tool" style="background:var(--accent); color:white; width:100%;" onclick="toggleGPS()">Start Tracking</button>
            <div id="gps-data" style="margin-top:10px;">Status: Satellite lock pending...</div>
            <div id="gps-meter"><div id="gps-bar"></div></div>
            <div id="jurisdictionBanner" style="margin-top:10px;">Select Jurisdiction in Settings</div>
        </div>

        <div class="card">
            <h3>1. Tolerance Zone Logic</h3>
            <div class="row" style="display:flex; gap:10px;">
                <div style="flex:1"><label>Asset Dia (in)</label><input type="number" id="pDia" value="0.5" inputmode="decimal" oninput="calc()"></div>
                <div style="flex:1"><label>Dist. from Mark (in)</label><input type="number" id="dOff" inputmode="decimal" oninput="calc()"></div>
            </div>
            <div id="res" style="margin-top:10px; padding:15px; border-radius:6px; text-align:center; font-weight:bold; border:1px solid #ccc;">Awaiting Data...</div>
        </div>

        <div class="card">
            <h3>2. Liability Narrative</h3>
            <select id="root" onchange="updateLiability()">
                <option value="">-- Select Root Cause --</option>
                <option value="1">1. No Notification (No Ticket)</option>
                <option value="2">2. Improper Excavation in TZ</option>
                <option value="3">3. Failure to Maintain Marks</option>
                <option value="5">5. Digging Outside Ticket Scope</option>
            </select>
            <div id="liability" style="background:#fff9e6; padding:10px; border-radius:6px; color:var(--danger); font-weight:bold; border-left:4px solid var(--danger); margin-top:10px; font-size:0.8rem; min-height:20px;"></div>
            <button class="btn-tool" style="width:100%; margin-top:10px;" onclick="toggleDictation('notes', this)">🎤 Dictate Scene Notes</button>
            <textarea id="notes" rows="4" placeholder="Investigator narrative..."></textarea>
        </div>

        <div class="card">
            <h3>3. Forensic Evidence</h3>
            <input type="file" id="photoInput" accept="image/*" capture="environment" multiple>
            <div id="preview" class="preview"></div>
            <div class="sigwrap"><canvas id="sig"></canvas></div>
            <button class="btn-tool" style="width:100%; margin-top:5px;" onclick="clearSig()">Clear Signature</button>
        </div>

        <button class="btn-full" style="background:var(--secondary);" onclick="generateFieldNotice()">📧 Email Forensic Report</button>
    </div>

    <div id="hdd" class="section">
        <div class="card">
            <h3>HDD / Bore Forensic Audit</h3>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <label><input type="checkbox" id="h1"> Crossing Potholed</label>
                <label><input type="checkbox" id="h2"> Bore Log Provided</label>
                <label><input type="checkbox" id="h3"> Sonde Active</label>
                <label><input type="checkbox" id="h4"> Data/Log Sync</label>
            </div>
            <label>Drill Speed Assessment</label>
            <select id="boreSpeed">
                <option>Consistent with Tracker</option>
                <option>Outran Tracker (Boring Blind)</option>
                <option>Inconsistent/High</option>
            </select>
            <textarea id="hddNotes" rows="4" placeholder="Bore-specific observations..."></textarea>
        </div>
    </div>

    <div id="reference" class="section">
        <div class="card">
            <h3>50-State Statute Database</h3>
            <input type="text" id="search" onkeyup="filterRef()" placeholder="Search state (e.g. Ohio)...">
            <div id="refList" style="margin-top:10px;"></div>
        </div>
    </div>

    <div id="settings" class="section">
        <div class="card">
            <h3>App Configuration</h3>
            <label>Home Jurisdiction</label>
            <select id="stateSelect"></select>
            <button class="btn-full" onclick="document.body.classList.toggle('solar-mode')">🔆 Toggle Solar Mode</button>
            <button class="btn-full" style="background:#666;" onclick="saveDraft()">💾 Save Draft Local</button>
        </div>
    </div>
</div>

<script>
let watchId = null, wakeLock = null, recognition = null;
let sigCtx, drawing = false;

const states = [
    ['AL','Alabama',18,'Alabama 811','2 business days','Ala. Code § 37-15'],
    ['AK','Alaska',24,'Alaska 811','2 business days','AS 42.30.400'],
    ['AZ','Arizona',24,'Arizona 811','2 working days','A.R.S. § 40-360.21'],
    ['AR','Arkansas',18,'Arkansas 811','2 business days','Ark. Code § 14-271'],
    ['CA','California',24,'USA North/SoCal 811','2 working days','Gov. Code § 4216'],
    ['CO','Colorado',18,'Colorado 811','2 business days','C.R.S. § 9-1.5-103'],
    ['CT','Connecticut',18,'Call Before You Dig','2 full working days','CGS § 16-345'],
    ['DE','Delaware',18,'Miss Utility of Delmarva','2 working days','7 Del. C. § 1728'],
    ['FL','Florida',24,'Sunshine 811','2 full business days','Fla. Stat. § 556.101'],
    ['GA','Georgia',18,'Georgia 811','2 business days','O.C.G.A. § 25-9-1'],
    ['HI','Hawaii',18,'Hawaii One Call','5 working days','HRS § 269E-1'],
    ['ID','Idaho',24,'Digline','2 business days','Idaho Code § 55-2201'],
    ['IL','Illinois',18,'JULIE','2 working days','220 ILCS 50/1'],
    ['IN','Indiana',24,'Indiana 811','2 full working days','IC § 8-1-26'],
    ['IA','Iowa',18,'Iowa One Call','2 working days','Iowa Code § 480'],
    ['KS','Kansas',24,'Kansas 811','2 working days','K.S.A. § 66-1801'],
    ['KY','Kentucky',18,'Kentucky 811','2 business days','KRS § 367.4901'],
    ['LA','Louisiana',18,'Louisiana 811','2 full business days','RS 40:1749.11'],
    ['ME','Maine',18,'Dig Safe','3 business days','23 MRSA § 3360-A'],
    ['MD','Maryland',18,'Miss Utility','2 business days','MD Code, Pub. Util. § 12-101'],
    ['MA','Massachusetts',18,'Dig Safe','3 business days','M.G.L. c. 82 § 40'],
    ['MI','Michigan',18,'MISS DIG 811','3 working days','Act 174 of 2013'],
    ['MN','Minnesota',24,'Gopher State One Call','2 working days','Minn. Stat. § 216D'],
    ['MS','Mississippi',18,'Mississippi 811','2 working days','Miss. Code § 77-13-1'],
    ['MO','Missouri',24,'Missouri 811','2 working days','RSMo § 319.010'],
    ['MT','Montana',18,'Montana 811','2 business days','MCA § 69-4-501'],
    ['NE','Nebraska',18,'Nebraska 811','2 business days','Neb. Rev. Stat. § 76-2301'],
    ['NV','Nevada',24,'USA North 811','2 working days','NRS § 455.080'],
    ['NH','New Hampshire',18,'Dig Safe','3 business days','RSA 374:48'],
    ['NJ','New Jersey',18,'New Jersey One Call','3 business days','N.J.S.A. 48:2-73'],
    ['NM','New Mexico',18,'New Mexico 811','2 working days','NMSA § 62-14-1'],
    ['NY','New York',24,'Udig NY','2 working days','16 NYCRR Part 753'],
    ['NC','North Carolina',24,'NC 811','3 working days','N.C.G.S. § 87-115'],
    ['ND','North Dakota',24,'North Dakota One Call','2 working days','N.D.C.C. § 49-23'],
    ['OH','Ohio',18,'Ohio 811','48 hours','ORC § 3781.25-32'],
    ['OK','Oklahoma',24,'Oklahoma 811','48 hours','63 O.S. § 142.1'],
    ['OR','Oregon',24,'Oregon Utility Notification','2 business days','ORS § 757.542'],
    ['PA','Pennsylvania',18,'PA One Call','3 business days','PA Act 287'],
    ['RI','Rhode Island',18,'Dig Safe','3 business days','R.I.G.L. § 39-1.2'],
    ['SC','South Carolina',24,'SC 811','3 full working days','S.C. Code § 58-36-10'],
    ['SD','South Dakota',18,'South Dakota 811','2 business days','SDCL § 49-7A'],
    ['TN','Tennessee',24,'Tennessee 811','3 working days','T.C.A. § 65-31-101'],
    ['TX','Texas',18,'Texas 811','48 hours','Texas Admin. Code § 18'],
    ['UT','Utah',18,'Blue Stakes of Utah','2 business days','Utah Code § 54-8a-1'],
    ['VT','Vermont',18,'Dig Safe','3 business days','30 V.S.A. § 7001'],
    ['VA','Virginia',24,'Virginia 811','2 working days','Va. Code § 56-265.14'],
    ['WA','Washington',24,'Washington 811','2 business days','RCW § 19.122'],
    ['WV','West Virginia',18,'WV 811','2 business days','W. Va. Code § 24-C'],
    ['WI','Wisconsin',18,'Diggers Hotline','3 working days','Wis. Stat. § 182.0175'],
    ['WY','Wyoming',24,'Wyoming 811','2 business days','Wyo. Stat. § 37-12-301']
];

const stateMap = Object.fromEntries(states.map(s => [s[0], {code:s[0], name:s[1], tz:s[2], center:s[3], notice:s[4], law:s[5]}]));
let currentState = stateMap.OH;

function q(id){return document.getElementById(id)}

function tab(name, btn){
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
    q(name).classList.add('active');
    btn.classList.add('active');
}

function init() {
    const sel = q('stateSelect');
    states.forEach(s => {
        const o = document.createElement('option');
        o.value = s[0]; o.textContent = `${s[0]} - ${s[1]}`; sel.appendChild(o);
    });
    sel.addEventListener('change', (e) => {
        currentState = stateMap[e.target.value];
        q('jurisdictionBanner').innerText = `Jurisdiction: ${currentState.name} (${currentState.center})`;
        calc();
    });
    sel.value = 'OH';
    buildPocket();
    initSig();
    
    q('photoInput').addEventListener('change', (e) => {
        q('preview').innerHTML = '';
        Array.from(e.target.files).forEach(f => {
            const img = document.createElement('img');
            img.src = URL.createObjectURL(f);
            img.className = 'thumb';
            q('preview').appendChild(img);
        });
    });

    if ('webkitSpeechRecognition' in window) recognition = new webkitSpeechRecognition();
}

async function toggleGPS() {
    if (watchId) {
        navigator.geolocation.clearWatch(watchId); watchId = null;
        q('gps-toggle').innerText = "Start Tracking"; q('gps-bar').style.width = "0%";
        if(wakeLock) await wakeLock.release();
        return;
    }
    q('gps-toggle').innerText = "Tracking Active...";
    if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    watchId = navigator.geolocation.watchPosition(pos => {
        const acc = pos.coords.accuracy;
        q('gps-data').innerHTML = `ACCURACY: +/- ${acc.toFixed(1)}m<br>LAT: ${pos.coords.latitude.toFixed(6)}<br>LON: ${pos.coords.longitude.toFixed(6)}`;
        q('gps-bar').style.width = Math.max(0, 100 - (acc * 5)) + "%";
        q('gps-bar').className = acc < 5 ? 'sig-excellent' : 'sig-poor';
    }, null, {enableHighAccuracy: true});
}

function calc() {
    const dia = parseFloat(q('pDia').value) || 0, off = parseFloat(q('dOff').value) || 0;
    const limit = currentState.tz + (dia/2);
    q('res').innerText = off <= limit ? `⚠️ INSIDE ZONE (${limit}")` : `✅ OUTSIDE ZONE (${limit}")`;
    q('res').style.background = off <= limit ? '#f8d7da' : '#d4edda';
    updateLiability();
}

function updateLiability() {
    const root = q('root').value, off = parseFloat(q('dOff').value) || 0, dia = parseFloat(q('pDia').value) || 0, limit = currentState.tz + (dia/2);
    let msg = (off > 0 && off <= limit) ? `STRIKE WITHIN ZONE: Violation of ${currentState.law}. Excavator failed to hand-dig within the ${limit}" tolerance zone. ` : "";
    if (root === "1") msg += `No valid 811 ticket found.`;
    q('liability').innerText = msg;
}

function toggleDictation(tid, btn) {
    if(!recognition) return alert("Speech not supported.");
    btn.classList.add('mic-active');
    recognition.start();
    recognition.onresult = (e) => { q(tid).value += e.results[0][0].transcript; };
    recognition.onend = () => btn.classList.remove('mic-active');
}

function initSig() {
    const canvas = q('sig');
    sigCtx = canvas.getContext('2d');
    canvas.width = canvas.parentElement.clientWidth;
    canvas.addEventListener('mousedown', () => drawing = true);
    window.addEventListener('mouseup', () => drawing = false);
    canvas.addEventListener('mousemove', (e) => {
        if (!drawing) return;
        const r = canvas.getBoundingClientRect();
        sigCtx.lineWidth = 2; sigCtx.lineTo(e.clientX - r.left, e.clientY - r.top); sigCtx.stroke();
    });
}

function clearSig() { sigCtx.clearRect(0,0,q('sig').width,q('sig').height); sigCtx.beginPath(); }

function buildPocket() {
    q('refList').innerHTML = states.map(s => `
        <div class="card">
            <h3>${s[1]} (${s[0]})</h3>
            <div style="font-size:0.75rem;"><strong>Statute:</strong> ${s[5]}<br><strong>TZ:</strong> ${s[2]}" + dia<br><strong>Center:</strong> ${s[3]}</div>
        </div>`).join('');
}

function filterRef() {
    const term = q('search').value.toLowerCase();
    Array.from(q('refList').getElementsByClassName('card')).forEach(c => {
        c.style.display = c.innerText.toLowerCase().includes(term) ? "block" : "none";
    });
}

function generateFieldNotice() {
    const body = `UTILITY DAMAGE FORENSIC REPORT\n------------------------------\nJURISDICTION: ${currentState.name}\nLAW: ${currentState.law}\n\nLIABILITY FINDING: ${q('liability').innerText}\n\nNOTES: ${q('notes').value}\n\nHDD AUDIT: ${q('h1').checked ? 'Potholed' : 'NOT Potholed'}`;
    window.location.href = `mailto:?subject=Damage Report&body=${encodeURIComponent(body)}`;
}

window.onload = init;
</script>
</body>
</html>
